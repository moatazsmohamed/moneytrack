<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f65">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="MoneyTrack — مساحة مالية خاصة بحسابك للدخل والمصروفات والميزانيات والأهداف.">
  <title>MoneyTrack — مساحة حسابك المالية</title>
  <link rel="icon" href="/assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/extensions.css">
  <script src="/js/vendor/chart.umd.js" defer></script>
  <script src="/js/vendor/lucide.min.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content" id="skip-link">تخطي إلى المحتوى</a>
  <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="التنقل الرئيسي">
    <a class="brand" href="#dashboard" aria-label="MoneyTrack"><span class="brand-mark"><img src="/assets/images/logo.svg" width="30" height="30" alt=""></span><span>Money<span class="brand-track">Track</span><small id="brand-tagline">مساحتك المالية الشخصية</small></span></a>
    <div class="workspace-label" id="workspace-label">مساحة العمل</div>
    <nav id="main-nav"></nav>
    <div class="sidebar-bottom">
      <div class="local-status"><span class="status-dot"></span><span id="local-status-text">مساحة عمل سحابية خاصة</span><i data-lucide="shield-check"></i></div>
      <a class="profile" href="#settings"><span class="avatar" id="avatar-initial">M</span><span><strong id="profile-name">الحساب</strong><small id="profile-caption"></small></span><i data-lucide="chevrons-up-down"></i></a>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="topbar-start"><button class="icon-btn mobile-menu" id="mobile-menu" aria-label="فتح التنقل" aria-expanded="false"><i data-lucide="menu"></i></button><div class="breadcrumb"><span>MoneyTrack</span><i data-lucide="chevron-right"></i><strong id="breadcrumb-current">نظرة عامة</strong></div></div>
      <div class="topbar-actions"><label class="global-search"><i data-lucide="search"></i><input type="search" id="global-search" placeholder="البحث في المعاملات…" autocomplete="off"><span class="search-hint">↵</span></label><button class="icon-btn" id="refresh-workspace" aria-label="تحديث مساحة العمل"><i data-lucide="refresh-cw"></i></button><button class="icon-btn language-btn" id="language-toggle" aria-label="تبديل اللغة">EN</button><button class="icon-btn" id="theme-toggle" aria-label="تبديل المظهر"><i data-lucide="moon"></i></button><div class="notification-wrapper"><button class="icon-btn" id="notification-toggle" aria-label="الإشعارات" aria-expanded="false"><i data-lucide="bell"></i><span id="notification-dot" class="notification-dot" hidden></span></button><section id="notification-panel" class="notification-panel" hidden></section></div><button class="icon-btn" id="logout-button" aria-label="تسجيل الخروج"><i data-lucide="log-out"></i></button></div>
    </header>
    <main id="main-content" tabindex="-1"><div class="loading-state"><span class="loader"></span><p>جارٍ تحميل MoneyTrack…</p></div></main>
    <footer class="app-footer"><span>MoneyTrack <span class="footer-dot">·</span> <span id="footer-label">لصورة مالية أوضح.</span></span><span id="footer-private"><i data-lucide="lock-keyhole"></i> بيانات خاصة بحسابك.</span></footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
